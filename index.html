<h2>沁园春 长沙</h2>
<p class="ht">看地理学81级毕业照感怀</p><br>

<p class="poem">辛酉入秋，岳麓山下，师院樟园</p>
<p class="poem">看湘江北去，滔滔一片；群山郁郁，碧峰连天</p>
<p class="poem">高歌四化，笑语满园，地学楼边橘香甜</p>
<p class="poem">莫惆怅，听林中晨诵，谁愿等闲</p><br>

<p class="poem">同窗四载有缘，转环球世间万物连</p>
<p class="poem">观风云天象，人文山川；岩生水气，交融四圈</p>
<p class="poem">匡庐沐瀑，洞庭戏涟，望断天涯南岳巅</p>
<p class="poem">再回首，虽华发霜染，无悔无怨</p><br>

<p class="ht">农历丙午年七月二十日(2026年9月1日）</p>
